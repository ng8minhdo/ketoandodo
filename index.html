function validateState(s){if(!s||s.version!==1||!Array.isArray(s.events))throw Error('Tệp không đúng định dạng sao lưu Dodo.');const used=new Set();const id=x=>{if(typeof x!=='string'||!/^[-a-zA-Z0-9_]{1,100}$/.test(x)||used.has(x))throw Error('Mã bản ghi bị thiếu hoặc trùng.');used.add(x);};const str=(x,max=500)=>{if(typeof x!=='string'||!x.trim()||x.length>max)throw Error('Tên hoặc nội dung không hợp lệ.');};const amt=(n,zero=false)=>{if(!Number.isSafeInteger(n)||n<(zero?0:1)||n>MAX)throw Error('Số tiền không hợp lệ.');};for(const e of s.events){id(e.id);str(e.name,150);if(typeof e.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))throw Error('Ngày không hợp lệ.');if(!Array.isArray(e.members)||!Array.isArray(e.expenses)||!Array.isArray(e.transfers))throw Error('Thiếu dữ liệu.');const ids=new Set();for(const m of e.members){id(m.id);str(m.name,100);ids.add(m.id);}const person=x=>{if(!ids.has(x))throw Error('Khoản tiền tham chiếu thành viên không tồn tại.');};let total=0;for(const x of e.expenses){id(x.id);str(x.name,150);amt(x.amount);total+=x.amount;person(x.payer);if(x.participants!==null){if(!Array.isArray(x.participants)||!x.participants.length||new Set(x.participants).size!==x.participants.length)throw Error('Nhóm chia tiền không hợp lệ.');x.participants.forEach(person);}if(x.mode!=='own'&&x.mode!=='funded')throw Error('Nguồn tiền không hợp lệ.');if(x.mode==='funded'){person(x.funder);if(x.funder===x.payer)throw Error('Người giao và người nhận phải khác nhau.');amt(x.advance);}if(typeof x.note!=='string'||x.note.length>1000)throw Error('Ghi chú không hợp lệ.');}for(const t of e.transfers){id(t.id);person(t.from);person(t.to);if(t.from===t.to)throw Error('Người gửi và nhận phải khác nhau.');amt(t.amount);if(typeof t.note!=='string'||t.note.length>1000)throw Error('Ghi chú không hợp lệ.');total+=t.amount;}if(e.fund){person(e.fund.holder);amt(e.fund.amount);if(!Array.isArray(e.fund.members)||new Set(e.fund.members).size!==e.fund.members.length)throw Error('Dữ <section class="hero"><div class="hero-row"><div><div class="eyebrow">${displayDate(e.date)} · Cùng nhau góp vui</div><h1>${esc(e.name)}</h1><p>Mỗi người một phần. Mọi khoản đều rõ ràng.</p></div>${btn('edit-event','Sửa tên','edit tiny')}</div><div class="stats"><div class="stat"><label>Tổng chi phí</label><strong>${money(c.total)}</strong><small>${e.expenses.length} khoản đã chi</small></div><div class="stat"><label>Bình quân / người</label><strong>${money(e.members.length?Math.round(c.total/e.members.length):0)}</strong><small>${e.expenses.some(x=>x.participants!==null)?'Xem phần thực trả trong bảng chia tiền':'Chia đều cho tất cả thành viên'}</small></div><div class="stat"><label>Thành viên</label><strong>${String(e.members.length).padStart(2,'0')} người</strong><small>Có thể thêm bất cứ lúc nào</small></div></div></section>
<nav class="section-tabs no-print"><a href="#expenses">01 · Khoản chi</a><a href="#balances">02 · Chia tiền</a><a href="#fund">03 · Quỹ đóng trước</a><a href="#transfers">04 · Tiền đã giao</a></nav>
<section class="panel"><div class="panel-head"><div><h2>Ai tham gia?</h2><p>Thêm tên hoặc biệt danh. Bấm vào tên để sửa.</p></div>${btn('member','＋ Thành viên','tiny')}</div><div class="members">${e.members.length?e.members.map(m=>`<div class="member"><span class="avatar">${esc(m.name.slice(0,1).toUpperCase())}</span><button class="member-name" data-act="edit-member" data-id="${m.id}">${esc(m.name)}</button><button class="icon" data-act="delete-member" data-id="${m.id}" aria-label="Xóa ${esc(m.name)}">×</button></div>`).join(''):'<span class="muted">Chưa có thành viên. Thêm mọi người để bắt đầu nhé.</span>'}</div></section>
<section class="panel" id="expenses"><div class="panel-head"><div><h2>Các khoản chi</h2><p>Ăn uống, thuê phòng, thuê xe… mỗi khoản một người mua.</p></div>${btn('expense','＋ Khoản chi','primary tiny')}</div>${e.expenses.length?`<div class="table-wrap"><table><thead><tr><th>Khoản chi</th><th>Người mua / trả</th><th>Nguồn tiền</th><th class="amount">Số tiền</th><th class="no-print">Thao tác</th></tr></thead><tbody>${e.expenses.map(x=>`<tr><td class="row-title"><b>${esc(x.name)}</b><small>${x.participants===null?'Tất cả thành viên':x.participants.length+' người cùng chia'}${x.note?' · '+esc(x.note):''}</small></td><td>${esc(personName(x.payer))}</td><td><span class="tag ${x.mode==='funded'?'gold':''}">${x.mode==='own'?'Tự ứng tiền':'Được giao tiền'}</span>${x.mode==='funded'?`<small>${esc(personName(x.funder))} giao ${money(x.advance)}</small>`:''}</td><td class="amount">${money(x.amount)}</td><td class="no-print">${btn('edit-expense','Sửa','tiny ghost',x.id)} <button class="icon danger" data-act="delete-expense" data-id="${x.id}" aria-label="Xóa khoản ${esc(x.name)}">×</button></td></tr>`).join('')}</tbody></table></div><div class="footnote">${e.expenses.length} khoản chi · Tổng cộng <b>${money(c.total)}</b>. Thêm khoản mới sẽ tạo thêm cột trong bảng chi tiết bên dưới.</div>`:`<div class="empty"><div class="empty-icon">＋</div><b>Cuộc vui bắt đầu từ khoản đầu tiên</b><p>Thêm chi phí và chọn ai đã trả tiền.</p>${btn('expense','Thêm khoản chi đầu tiên','primary')}</div>`}</section>
<section class="panel" id="balances"><div class="panel-head"><div><h2>Chia tiền từng người</h2><p>Đã trừ tiền tự ứng và tính cả tiền giao / nhận giữa các thành viên.</p></div>${btn('print','In / PDF','tiny ghost')}</div>${e.members.length?`<div class="table-wrap"><table><thead><tr><th>Thành viên</th><th class="amount">Phần phải chịu</th><th class="amount">Đã trả mua đồ</th><th class="amount">Đã giao người khác</th><th class="amount">Đã nhận từ người khác</th><th class="amount">Còn lại</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="amount">${money(r.share)}</td><td class="amount">${money(r.spent)}</td><td class="amount">${money(r.sent)}</td><td class="amount">${money(r.received)}</td><td class="amount ${r.net>0?'balance-positive':r.net<0?'balance-negative':'zero'}">${money(Math.abs(r.net))}<small>${r.net>0?'Được nhận lại':r.net<0?'Cần đóng thêm':'Đã cân bằng'}</small></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Thêm thành viên để xem bảng chia tiền.</div>'}<div class="footnote">Số dư = tiền đã trả mua đồ + tiền đã giao − tiền đã nhận − phần chi phí phải chịu. Chênh lệch chia lẻ được phân bổ từng 1 đồng theo thứ tự thành viên của khoản chi.</div><details class="help"><summary>Xem bảng chi tiết: mỗi khoản chi là một cột</summary><div class="table-wrap" style="margin-top:12px"><table class="matrix"><thead><tr><th>Thành viên</th>${e.expenses.map(x=>`<th>${esc(x.name)}</th>`).join('')}<th>Tổng phần chịu</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td>${esc(r.name)}</td>${e.expenses.map(x=>`<td class="amount">${r.parts[x.id]===undefined?'—':money(r.parts[x.id])}</td>`).join('')}<td class="amount">${money(r.share)}</td></tr>`).join('')}</tbody></table></div></details></section>
<div class="settle-grid"><section class="panel"><div class="panel-head"><div><h2>Ai chuyển cho ai?</h2><p>Còn ${money(c.outstanding)} cần thanh toán giữa mọi người.</p></div><span class="tag grey">${c.settlements.length} lượt</span></div>${c.settlements.length?`<div class="transfer-list">${c.settlements.map((t,i)=>`<div class="transfer"><div><p>${esc(personName(t.from))} <span class="muted">→</span> ${esc(personName(t.to))}</p><strong>${money(t.amount)}</strong></div>${btn('settle','Đã chuyển','tiny',String(i))}</div>`).join('')}</div>`:`<div class="empty"><b>${c.total?'Mọi người đã cân bằng ✓':'Chưa có khoản cần thanh toán'}</b><p>${c.total?'Các khoản chi đã được bù trừ đủ.':'Ghi chi phí để Dodo tính giúp bạn.'}</p></div>`}<div class="footnote">Chỉ bấm “Đã chuyển” sau khi tiền đã được giao thực tế. Đây là gợi ý bù trừ; bạn cũng có thể ghi nhận số tiền chuyển khác bên dưới.</div></section><section class="panel"><details class="help" open><summary>Ghi tiền sao cho đúng?</summary><p><b>1. Tự ứng:</b> chọn người mua và “Tự ứng tiền”. Tiền mua được trừ vào phần họ phải đóng.</p><p><b>2. Được giao tiền:</b> chọn người mua, người giao và số tiền đã giao cho khoản đó. Dodo tính cả tiền dư hoặc phần ứng thêm.</p><p><b>3. Giao một lần cho nhiều khoản:</b> ghi một lượt trong “Tiền đã giao”, rồi nhập các khoản chi ở chế độ “Tự ứng / đã ghi giao tiền riêng”. Không ghi tiền giao lặp lại.</p><p><b>Ví dụ:</b> An giao Bình 500.000 ₫, Bình mua hết 400.000 ₫. Nhóm 4 người chịu 100.000 ₫/người. Bình cần trả 200.000 ₫ (100.000 ₫ còn giữ + 100.000 ₫ phần mình); An nhận lại tổng 400.000 ₫.</p></details></section></div>
${fundPanel(e,c)}
<section class="panel" id="transfers"><div class="panel-head"><div><h2>Tiền đã giao & thanh toán</h2><p>Góp trước, giao tiền đi chợ, trả tiền thừa hoặc thanh toán cuối buổi.</p></div>${btn('transfer','＋ Ghi giao tiền','tiny')}</div>${e.transfers.length?`<div class="table-wrap"><table><thead><tr><th>Người giao → người nhận</th><th>Ghi chú</th><th class="amount">Số tiền</th><th class="no-print">Thao tác</th></tr></thead><tbody>${e.transfers.map(t=>`<tr><td>${esc(personName(t.from))} → ${esc(personName(t.to))}</td><td class="row-title">${esc(t.note)||'—'}</td><td class="amount">${money(t.amount)}</td><td class="no-print">${t.fund?'<span class="tag">Quỹ</span>':btn('edit-transfer','Sửa','tiny ghost',t.id)+' <button class="icon danger" data-act="delete-transfer" data-id="'+t.id+'" aria-label="Xóa giao tiền">×</button>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:20px">Chưa có lượt giao tiền riêng.</div>'}<div class="footnote">Tiền giao gắn với khoản chi đã được tính tự động ở phía trên, không cần nhập lại vào đây. Giao tiền không làm tăng tổng chi phí.</div></section>
<div class="no-print" style="display:flex;justify-content:space-between;gap:10px;margin-top:16px">${btn('demo','Xem dữ liệu mẫu','tiny ghost')}${btn('delete-event','Xóa cuộc vui này','tiny ghost danger')}</div>`;}
function fundPanel(e,c){const f=e.fund,head=btn('fund',f?'Sửa quỹ':'＋ Thu quỹ trước','tiny');
if(!f)return `<section class="panel" id="fund"><div class="panel-head"><div><h2>Quỹ đóng trước</h2><p>Mỗi người góp trước một khoản. Cuối chuyến trả lại phần thừa hoặc thu thêm phần thiếu.</p></div>${head}</div><div class="empty" style="padding:20px">Chưa thu quỹ.</div></section>`;
const mem=new Set(f.members),total=f.amount*f.members.length,diff=total-c.total;
return `<section class="panel" id="fund"><div class="panel-head"><div><h2>Quỹ đóng trước</h2><p>Thủ quỹ: <b>${esc(personName(f.holder))}</b> · ${f.members.length} người đóng, mỗi người ${money(f.amount)}</p></div><div>${head} ${btn('delete-fund','Xóa quỹ','tiny ghost danger')}</div></div><div style="padding:0 22px 16px"><div class="notice">Quỹ thu <b>${money(total)}</b> · Tổng chi <b>${money(c.total)}</b> · ${diff>=0?'Quỹ còn thừa <b>'+money(diff)+'</b>':'Quỹ thiếu <b>'+money(-diff)+'</b>, cần thu thêm'}</div></div><div class="table-wrap"><table><thead><tr><th>Thành viên</th><th class="amount">Đã đóng quỹ</th><th class="amount">Phần phải chịu</th><th class="amount">Thừa / thiếu</th></tr></thead><tbody>${c.rows.map(r=>{const d=(mem.has(r.id)?f.amount:0)-r.share;return `<tr><td><b>${esc(r.name)}</b>${r.id===f.holder?' <span class="tag grey">Thủ quỹ</span>':''}</td><td class="amount">${mem.has(r.id)?money(f.amount):'—'}</td><td class="amount">${money(r.share)}</td><td class="amount ${d>0?'balance-positive':d<0?'balance-negative':'zero'}">${money(Math.abs(d))}<small>${d>0?'Được trả lại':d<0?'Cần đóng thêm':'Vừa đủ'}</small></td></tr>`;}).join('')}</tbody></table></div><div class="footnote">Thừa / thiếu = số đã đóng quỹ − phần phải chịu. Mục “Ai chuyển cho ai?” phía trên đã tính sẵn lượt trả lại hoặc thu thêm. Nếu có khoản ai đó tự trả riêng, kết quả cuối cùng nằm ở mục đó.</div></section>`;}
function options(selected='',exclude=''){return event().members.filter(m=>m.id!==exclude).map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${esc(m.name)}</option>`).join('');}
function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function select(label,name,value=''){return `<label>${label}<select name="${name}" required>${options(value)}</select></label>`;}
function openEditor(type,id='',preset=null){const e=event();if(type==='fund'&&e.members.length<2){toast('Cần ít nhất 2 thành viên để thu quỹ.');return;}if(type==='expense'&&!e.members.length){toast('Thêm ít nhất 1 thành viên trước nhé.');openEditor('member');return;}if(type==='transfer'&&e.members.length<2){toast('Cần ít nhất 2 thành viên để ghi giao tiền.');return;}editing={type,id,preset};let fields='',title='';if(type==='event'){const x=id?e:{name:'',date:today()};title=id?'Sửa cuộc vui':'Tạo cuộc vui mới';fields=field('Tên cuộc vui','name',x.name,'text','required maxlength="150" placeholder="Ví dụ: Liên hoan cuối tuần"')+field('Ngày','date',x.date,'date','required');}if(type==='member'){const m=e.members.find(v=>v.id===id);title=id?'Sửa tên thành viên':'Thêm thành viên';fields=id?field('Tên / biệt danh','name',m.name,'text','required maxlength="100"'):'<label>Tên thành viên<textarea name="names" rows="5" required placeholder="An\nBình\nChi"></textarea></label><p class="note">Mỗi dòng một người. Thêm bao nhiêu người tùy bạn; dùng biệt danh để tránh trùng tên.</p>';}if(type==='expense'){const x=e.expenses.find(v=>v.id===id)||{name:'',amount:'',payer:e.members[0]?.id,mode:'own',funder:e.members[1]?.id,advance:'',participants:null,note:''};title=id?'Sửa khoản chi':'Thêm khoản chi';fields=field('Tên khoản chi','name',x.name,'text','required maxlength="150" placeholder="Ví dụ: Mua hải sản"')+`<div class="two-col">${field('Số tiền thực chi (đồng)','amount',x.amount?new Intl.NumberFormat('vi-VN').format(x.amount):'','text','required inputmode="numeric" data-money placeholder="500.000"')}${select('Người mua / trả tiền','payer',x.payer)}</div>`+`<div><label style="margin-bottom:8px">Nguồn tiền</label><div class="choices"><label class="choice"><input type="radio" name="mode" value="own" ${x.mode==='own'?'checked':''}> Tự ứng tiền</label><label class="choice"><input type="radio" name="mode" value="funded" ${x.mode==='funded'?'checked':''} ${e.members.length<2?'disabled':''}> Được giao tiền đi mua</label></div><p class="note">Nếu lượt giao tiền đã được ghi riêng bên dưới, chọn “Tự ứng tiền” để không tính trùng.</p></div><div id="funded-fields" class="form-grid ${x.mode==='funded'?'':'hidden'}"><div class="two-col">${select('Ai giao tiền cho người mua?','funder',x.funder)}${field('Đã giao bao nhiêu? (đồng)','advance',x.advance?new Intl.NumberFormat('vi-VN').format(x.advance):'','text','inputmode="numeric" data-money placeholder="500.000"')}</div><div class="notice">Chỉ ghi tiền đã thực sự giao cho khoản này. Tiền thừa hoặc phần người mua ứng thêm sẽ tự được tính khi chia tiền.</div></div><div><label class="choice"><input type="checkbox" name="all" ${x.participants===null?'checked':''}> Chia đều tất cả thành viên</label><p class="note">Khi thêm người mới, các khoản chọn “tất cả” sẽ tự chia lại.</p></div><div id="participant-fields" class="check-list ${x.participants===null?'hidden':''}">${e.members.map(m=>`<label><input type="checkbox" name="participants" value="${m.id}" ${x.participants===null||x.participants.includes(m.id)?'checked':''}>${esc(m.name)}</label>`).join('')}</div><label>Ghi chú (không bắt buộc)<textarea name="note" rows="2" maxlength="1000">${esc(x.note)}</textarea></label>`;}if(type==='transfer'){const t=preset||e.transfers.find(v=>v.id===id)||{from:e.members[0]?.id,to:e.members[1]?.id,amount:'',note:''};title=preset?'Xác nhận tiền đã chuyển':id?'Sửa lượt giao tiền':'Ghi nhận tiền đã giao';fields=`<div class="two-col">${select('Người giao tiền','from',t.from)}${select('Người nhận tiền','to',t.to)}</div>`+field('Số tiền đã chuyển (đồng)','amount',t.amount?new Intl.NumberFormat('vi-VN').format(t.amount):'','text','required inputmode="numeric" data-money')+`<label>Ghi chú<textarea name="note" maxlength="1000" rows="2" placeholder="Góp trước / giao tiền mua đồ / trả tiền thừa…">${esc(t.note||'')}</textarea></label><div class="notice">Chỉ ghi tiền đã chuyển thực tế giữa các thành viên. Không nhập lại tiền giao đã gắn trong một khoản chi.</div>`;}if(type==='fund'){const f=e.fund||{holder:e.members[0].id,amount:'',members:e.members.map(m=>m.id)};title=e.fund?'Sửa quỹ đóng trước':'Thu quỹ đóng trước';fields=`<div class="two-col">${select('Người giữ quỹ (thủ quỹ)','holder',f.holder)}${field('Mỗi người đóng trước (đồng)','amount',f.amount?new Intl.NumberFormat('vi-VN').format(f.amount):'','text','required inputmode="numeric" data-money placeholder="1.000.000"')}</div><div><label style="margin-bottom:8px">Ai đã đóng quỹ?</label><div class="check-list">${e.members.map(m=>`<label><input type="checkbox" name="fundmembers" value="${m.id}" ${f.members.includes(m.id)?'checked':''}>${esc(m.name)}</label>`).join('')}</div><p class="note">Tích cả thủ quỹ nếu thủ quỹ cũng góp phần mình. Khi nhập khoản chi, chọn “Người mua / trả tiền” là thủ quỹ nếu khoản đó chi từ quỹ.</p></div>`;}$('#dialog-title').textContent=title;$('#fields').innerHTML=fields;$('#form-error').textContent='';$('#editor').showModal();setTimeout(()=>$('#fields').querySelector('input,textarea,select')?.focus(),30);}
function parseMoney(v){v=String(v).trim();if(!/^\d+(?:[.,\s]\d{3})*$/.test(v))throw Error('Nhập số tiền nguyên theo đồng, ví dụ 500000 hoặc 500.000.');const n=Number(v.replace(/[.,\s]/g,''));if(!Number.isSafeInteger(n)||n<=0||n>MAX)throw Error('Số tiền phải lớn hơn 0 và không quá 1.000 tỷ đồng.');return n;}
$('#editor-form').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target),old=structuredClone(state),e=event(),val=k=>String(f.get(k)||'').trim();try{if(editing.type==='event'){const name=val('name');if(!name)throw Error('Hãy nhập tên cuộc vui.');if(editing.id){e.name=name;e.date=val('date');}else{const n=freshEvent(name);n.date=val('date');state.events.push(n);state.current=n.id;}}if(editing.type==='member'){const names=(editing.id?[val('name')]:val('names').split(/\n/).map(n=>n.trim()).filter(Boolean)),seen=new Set(e.members.filter(m=>m.id!==editing.id).map(m=>m.name.toLocaleLowerCase('vi')));if(!names.length)throw Error('Nhập ít nhất một tên.');for(const name of names){if(name.length>100)throw Error('Mỗi tên tối đa 100 ký tự.');if(seen.has(name.toLocaleLowerCase('vi')))throw Error('Tên “'+name+'” bị trùng. Hãy dùng biệt danh khác.');seen.add(name.toLocaleLowerCase('vi'));}if(editing.id)e.members.find(m=>m.id===editing.id).name=names[0];else names.forEach(name=>e.members.push({id:uid(),name}));}if(editing.type==='expense'){const x={id:editing.id||uid(),name:val('name'),amount:parseMoney(val('amount')),payer:val('payer'),mode:val('mode'),funder:null,advance:0,participants:f.has('all')?null:f.getAll('participants'),note:val('note')};if(!x.name)throw Error('Nhập tên khoản chi.');if(x.participants!==null&&!x.participants.length)throw Error('Chọn ít nhất 1 người cùng chia.');if(x.mode==='funded'){x.funder=val('funder');x.advance=parseMoney(val('advance'));if(x.funder===x.payer)throw Error('Người giao tiền phải khác người mua.');}if(editing.id)e.expenses[e.expenses.findIndex(v=>v.id===editing.id)]=x;else e.expenses.push(x);}if(editing.type==='transfer'){const t={id:editing.id||uid(),from:val('from'),to:val('to'),amount:parseMoney(val('amount')),note:val('note')};if(t.from===t.to)throw Error('Người giao và người nhận phải khác nhau.');if(editing.id)e.transfers[e.transfers.findIndex(v=>v.id===editing.id)]=t;else e.transfers.push(t);}if(editing.type==='fund'){const holder=val('holder'),amount=parseMoney(val('amount')),members=f.getAll('fundmembers');if(!members.length)throw Error('Chọn ít nhất 1 người đã đóng quỹ.');e.transfers=e.transfers.filter(t=>!t.fund);e.fund={holder,amount,members};members.filter(id=>id!==holder).forEach(id=>e.transfers.push({id:uid(),from:id,to:holder,amount,note:'Đóng quỹ trước',fund:true}));}validateState(state);$('#editor').close();commit();toast('Đã lưu thay đổi.');}catch(err){state=old;$('#form-error').textContent=err.message;}});
$('#fields').addEventListener('change',ev=>{if(ev.target.name==='mode')$('#funded-fields').classList.toggle('hidden',ev.target.value!=='funded');if(ev.target.name==='all')$('#participant-fields').classList.toggle('hidden',ev.target.checked);});$('#fields').addEventListener('blur',ev=>{if(ev.target.hasAttribute('data-money')&&ev.target.value){try{ev.target.value=new Intl.NumberFormat('vi-VN').format(parseMoney(ev.target.value));}catch{}}},true);
function download(text,name,type){const b=new Blob([text],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function safeFilename(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9_-]+/g,'-').slice(0,70);}
function backup(){download(JSON.stringify(state,null,2),'Dodo-sao-luu-'+today()+'.json','application/json');toast('Đã tạo bản sao lưu tất cả cuộc vui.');}
function saveHTML(){const doc=document.documentElement.cloneNode(true),s=structuredClone(state);s.instance=uid();doc.querySelector('#seed-data').textContent=JSON.stringify(s).replace(/</g,'\\u003c');doc.querySelector('#editor').removeAttribute('open');doc.querySelector('#toast').classList.add('hidden');download('<!DOCTYPE html>\n'+doc.outerHTML,'Ke-toan-Dodo-'+today()+'.html','text/html;charset=utf-8');toast('Đã tạo HTML chứa toàn bộ dữ liệu hiện tại.');}
function csv(){const e=event(),c=calculate(e);let rows=[['KẾ TOÁN DODO',e.name],['Ngày',e.date],[],['THÀNH VIÊN','Phần phải chịu','Đã trả mua đồ','Đã giao','Đã nhận','Được nhận (+) / Cần đóng (-)'],...c.rows.map(r=>[r.name,r.share,r.spent,r.sent,r.received,r.net]),[],['KHOẢN CHI','Số tiền','Người mua','Nguồn tiền','Người giao','Tiền đã giao','Người cùng chia','Ghi chú'],...e.expenses.map(x=>[x.name,x.amount,personName(x.payer),x.mode==='own'?'Tự ứng / giao tiền riêng':'Được giao tiền',x.mode==='funded'?personName(x.funder):'',x.advance||'',x.participants===null?'Tất cả thành viên':x.participants.map(id=>personName(id)).join(', '),x.note]),[],['TIỀN ĐÃ GIAO RIÊNG','Người nhận','Số tiền','Ghi chú'],...e.transfers.map(t=>[personName(t.from),personName(t.to),t.amount,t.note]),[],['GỢI Ý CHUYỂN','Người nhận','Số tiền'],...c.settlements.map(t=>[personName(t.from),personName(t.to),t.amount])];download('\uFEFF'+rows.map(r=>r.map(v=>{let s=String(v??'');if(typeof v==='string'&&/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(',')).join('\r\n'),'Dodo-'+safeFilename(e.name)+'.csv','text/csv;charset=utf-8');}
function demo(){const e=freshEvent('Dodo · Chuyến đi cuối tuần');e.members=['An','Bình','Chi','Dũng'].map(name=>({id:uid(),name}));const [a,b,c,d]=e.members.map(m=>m.id);e.expenses=[{id:uid(),name:'Thuê phòng',amount:1200000,payer:a,mode:'own',funder:null,advance:0,participants:null,note:'1 đêm'},{id:uid(),name:'Mua hải sản',amount:650000,payer:b,mode:'funded',funder:a,advance:700000,participants:null,note:'An giao Bình 700.000 ₫; còn dư 50.000 ₫'},{id:uid(),name:'Hoa quả & rau',amount:150000,payer:c,mode:'own',funder:null,advance:0,participants:null,note:''}];state.events.push(e);state.current=e.id;commit();toast('Đã tạo cuộc vui mẫu riêng để thử.');}
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-act]');if(!target)return;const a=target.dataset.act,id=target.dataset.id,e=event();if(readOnly&&!['switch','backup','csv','print','close','unlock','lock'].includes(a)){toast('Đang ở chế độ chỉ xem. Bấm “Mở khóa để sửa”.');return;}switch(a){case'unlock':unlock();break;case'lock':lock();break;case'new-event':openEditor('event');break;case'edit-event':openEditor('event',e.id);break;case'member':openEditor('member');break;case'edit-member':openEditor('member',id);break;case'expense':openEditor('expense');break;case'edit-expense':openEditor('expense',id);break;case'transfer':openEditor('transfer');break;case'edit-transfer':openEditor('transfer',id);break;case'close':$('#editor').close();break;case'switch':state.current=id;commit();break;case'delete-member':{if(e.expenses.some(x=>x.payer===id||x.funder===id||x.participants===null||x.participants.includes(id))||e.transfers.some(t=>t.from===id||t.to===id)||(e.fund&&(e.fund.holder===id||e.fund.members.includes(id)))){toast('Thành viên có liên quan khoản tiền. Hãy sửa hoặc xóa các khoản liên quan trước.');return;}if(confirm('Xóa thành viên '+personName(id)+'?')){e.members=e.members.filter(m=>m.id!==id);commit();}break;}case'delete-expense':if(confirm('Xóa khoản chi này? Tiền giao gắn với khoản này cũng được xóa.')){e.expenses=e.expenses.filter(x=>x.id!==id);commit();}break;case'delete-transfer':if(confirm('Xóa lượt giao tiền này và tính lại số dư?')){e.transfers=e.transfers.filter(t=>t.id!==id);commit();}break;case'delete-event':if(confirm('Xóa toàn bộ “'+e.name+'”? Hãy sao lưu trước nếu cần giữ dữ liệu.')){state.events=state.events.filter(v=>v.id!==e.id);if(!state.events.length)state.events.push(freshEvent());state.current=state.events[0].id;commit();}break;case'settle':{const t=calculate(e).settlements[Number(id)];if(t)openEditor('transfer','',{...t,note:'Thanh toán theo bảng chia tiền'});break;}case'fund':openEditor('fund');break;case'delete-fund':if(confirm('Xóa quỹ đóng trước? Các lượt đóng quỹ cũng bị xóa và số dư được tính lại.')){e.fund=null;e.transfers=e.transfers.filter(t=>!t.fund);commit();}break;case'backup':backup();break;case'save-html':saveHTML();break;case'import':$('#import-file').click();break;case'csv':csv();break;case'print':window.print();break;case'demo':demo();break;}});
$('#mobile-event').addEventListener('change',ev=>{state.current=ev.target.value;commit();});
$('#import-file').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('Tệp lớn hơn 20 MB.');const imported=validateState(JSON.parse(await file.text()));if(!imported.events.length)throw Error('Bản sao lưu không có cuộc vui.');if(!confirm('Khôi phục '+imported.events.length+' cuộc vui từ bản sao lưu? Dữ liệu hiện tại sẽ được thay thế. Hãy sao lưu hiện tại trước nếu cần.'))return;state=structuredClone(imported);storageOK=true;commit();toast('Đã khôi phục dữ liệu.');}catch(err){alert('Không thể khôi phục: '+err.message);}finally{ev.target.value='';}});
window.addEventListener('storage',ev=>{if(ev.key===KEY&&ev.newValue&&!online&&!readOnly){try{const next=validateState(JSON.parse(ev.newValue));if($('#editor').open){toast('Dữ liệu đã đổi ở cửa sổ khác. Lưu bản sao trước khi tải lại trang.');return;}state=next;render();toast('Đã cập nhật từ cửa sổ khác.');}catch{}}});

const API='/.netlify/functions/share',PWKEY='dodo-pw-v1';
var readOnly=true;let online=false,serverHasPw=false,pw=null,pushTimer,pushing=false,pushAgain=false,lastSync=0,offlineMsg='';
try{pw=localStorage.getItem(PWKEY);}catch{}
document.body.classList.add('ro');
async function api(method,body){let r,j;try{r=await fetch(API,method==='GET'?{cache:'no-store'}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});}catch{throw Object.assign(Error('Không kết nối được máy chủ (đang mở file trên máy hoặc mất mạng).'),{offline:true});}
try{j=await r.json();}catch{throw Object.assign(Error(r.status===404?'Không tìm thấy hàm lưu online (lỗi 404): kiểm tra file netlify/functions/share.mjs và package.json đã có trên GitHub, rồi deploy lại.':'Máy chủ trả lỗi '+r.status+'. Xem Netlify → Logs → Functions.'),{offline:true});}
if(!r.ok)throw Error(j.error||('Lỗi '+r.status));return j;}
function updateUI(){const b=$('#share-banner'),k=$('#lock-btn'),t=lastSync?new Date(lastSync).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'';
if(!online){b.innerHTML='⚠️ Đang chạy riêng trên máy này, <b>chưa đồng bộ online</b>. '+esc(offlineMsg);b.classList.remove('hidden');k.classList.add('hidden');}
else if(readOnly){b.innerHTML='👀 Bạn đang xem bản chung (chỉ xem). Tự cập nhật mỗi 30 giây'+(t?' · lúc '+t:'')+'. Muốn sửa, bấm <b>Mở khóa để sửa</b> ở thanh bên.';b.classList.remove('hidden');k.textContent='✏️ Mở khóa để sửa';k.dataset.act='unlock';k.classList.remove('hidden');}
else{b.innerHTML='✏️ Đang ở chế độ sửa. Mọi thay đổi tự lưu online, ai mở link chính cũng thấy ngay.';b.classList.remove('hidden');k.textContent='🔒 Khóa lại (chỉ xem)';k.dataset.act='lock';k.classList.remove('hidden');}
document.body.classList.toggle('ro',readOnly&&online);}
async function pushNow(){if(!online||readOnly)return;if(pushing){pushAgain=true;return;}pushing=true;$('#save-status').textContent='Đang lưu online…';try{await api('POST',{action:'save',pw,state});lastSync=Date.now();$('#save-status').textContent='Đã lưu online';}catch(err){$('#save-status').textContent='Chưa lưu được online';toast('Chưa lưu online: '+err.message);if(err.message==='Sai mật khẩu')lock();}finally{pushing=false;if(pushAgain){pushAgain=false;pushNow();}}}
function schedulePush(){if(!online||readOnly)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,600);}
async function pull(){if(!online||!readOnly||$('#editor').open)return;try{const r=await api('GET');if(!r.state)return;const next=validateState(r.state),cur=state.current;state=next;if(next.events.some(e=>e.id===cur))state.current=cur;lastSync=r.updated;render();updateUI();}catch{}}
async function unlock(){if(!online){toast('Chưa kết nối máy chủ nên không mở khóa được.');return;}
let p=prompt(serverHasPw?'Nhập mật khẩu để sửa dữ liệu:':'Chưa có mật khẩu. Hãy tạo mật khẩu sửa (ít nhất 4 ký tự). Người chỉ xem không cần mật khẩu:');if(!p)return;p=p.trim();
try{const r=await api('POST',{action:'check',pw:p});pw=p;try{localStorage.setItem(PWKEY,pw);}catch{}readOnly=false;if(r.fresh){serverHasPw=true;await pushNow();}save();render();updateUI();toast('Đã mở khóa. Bạn có thể sửa.');}catch(err){alert(err.message);}}
function lock(){readOnly=true;pw=null;try{localStorage.removeItem(PWKEY);}catch{}render();updateUI();pull();}
$('#content').innerHTML='<div class="panel"><div class="empty"><b>Đang tải dữ liệu…</b></div></div>';
(async()=>{try{const r=await api('GET');online=true;serverHasPw=r.hasPw;
if(r.state){state=validateState(r.state);lastSync=r.updated;}
readOnly=true;
if(pw&&r.hasPw){try{await api('POST',{action:'check',pw});readOnly=false;}catch(e){pw=null;try{localStorage.removeItem(PWKEY);}catch{}}}
render();updateUI();
setInterval(()=>{if(!document.hidden)pull();},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull();});}
catch(err){online=false;readOnly=false;offlineMsg=err.message;render();updateUI();if(storageOK)save();else showStorage();}})();
</script></body></html>
